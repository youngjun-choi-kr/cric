name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pyflakes
      - run: python -m pyflakes src/cric web/serve.py scripts tests
      - run: python -m pytest -q   # physics, safety rules and eval grading; no network, no API keys

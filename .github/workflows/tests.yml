name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,film]" pyflakes   # film = playwright; tests/test_web.py uses the runner's Chrome
      - run: python -m pyflakes src/cric web/serve.py scripts tests
      - run: python -m pytest -q   # physics, safety rules, eval grading, browser replays of the static console and studio; no API keys
      - run: node tests/test_rocketgen.mjs   # the 3D rocket builder's sizing rules

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cric .
      - run: docker run --rm cric watch --help   # the image the Nebius job runs starts and parses its arguments

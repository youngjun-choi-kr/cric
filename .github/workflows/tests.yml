name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,film]" pyflakes   # film = playwright; tests/test_web.py uses the runner's Chrome
      - run: python -m pyflakes src/cric web/serve.py scripts tests
      - run: python -m pytest -q   # physics, safety rules, eval grading, a browser replay of the static console; no API keys

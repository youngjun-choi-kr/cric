name: live data

# Daily: fresh CelesTrak catalog screened for the next 24 h, published to the `live` branch (force-pushed, one
# commit) for the static console. Add NEBIUS_API_KEY and TAVILY_API_KEY as repository secrets to also run one
# real incident a day; without them only the orbit data is refreshed.
on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - id: refresh
        # exit 75: CelesTrak unreachable after retries. Keep yesterday's live data and warn instead of failing.
        run: |
          set +e
          python scripts/live_refresh.py --out live_out; code=$?
          if [ $code -eq 75 ]; then echo "::warning::CelesTrak unreachable; kept yesterday's live data"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $code
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          CRIC_DATA_DIR: ${{ runner.temp }}/cric-data
      - name: publish to the live branch
        if: steps.refresh.outputs.skip != '1'
        run: |
          cd live_out
          git init -q -b live
          git config user.name "cric-live-bot"
          git config user.email "cric-live-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Live data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live
